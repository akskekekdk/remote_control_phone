# Render.com 원클릭 배포 블루프린트.
# 1) github.com/akskekekdk/remote_control_phone 를 Render에 연결
# "New +" → "Blueprint" → 이 저장소 선택 → render.yaml(루트) 자동 인식 → Apply
# 3) 배포 후 나오는 주소 뒤에 /ws 를 붙여 앱에 입력 (예: wss://remotectl-signaling.onrender.com/ws)
services:
  - type: web
    name: remotectl-signaling
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node signaling.js
    healthCheckPath: /health
    autoDeploy: true
