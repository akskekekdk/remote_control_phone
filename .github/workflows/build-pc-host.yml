name: Build PC Host (Windows exe)

# 파이썬 설치 없이 쓸 수 있도록, Windows 에서 단일 실행파일(host_pc.exe)을 만들어
# 'pc-host' 릴리스에 올린다. 다운로드 주소(고정):
#   https://github.com/akskekekdk/remote_control_phone/releases/download/pc-host/host_pc.exe

on:
  workflow_dispatch:
  push:
    paths:
      - "pc_host/**"
      - ".github/workflows/build-pc-host.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r pc_host/requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build exe
        run: >
          pyinstaller --onefile --name host_pc --noconfirm
          --collect-all av
          --collect-all aiortc
          --collect-all aioice
          --collect-all pylibsrtp
          --collect-all cryptography
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import mss.windows
          pc_host/host_pc.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: host_pc-windows
          path: dist/host_pc.exe

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-host
          name: "PC Host (Windows)"
          body: "원격조종 Windows 미니PC 호스트. host_pc.exe 를 받아 실행하세요(파이썬 불필요). 처음 실행하면 옆에 config.ini 가 생기며, 방코드·PIN·Cloudflare 값을 폰 앱과 똑같이 채운 뒤 다시 실행합니다."
          files: dist/host_pc.exe
